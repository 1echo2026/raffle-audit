<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话术模板管理 · 中奖名单审核工具</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .tpl-row textarea { min-height: 80px; }
  /* 模板名称框:主名称一行,括号内说明换行小字 */
  .tpl-row .tpl-name {
    width: 150px; box-sizing: border-box; padding: 7px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .tpl-name .tn-main, .tpl-name .tn-sub {
    width: 100%; border: 0; background: transparent; outline: none;
    padding: 0; font-family: inherit; text-align: left;
  }
  .tpl-name .tn-main { font-weight: bold; font-size: 13px; color: #17324a; }
  .tpl-name .tn-sub { font-size: 11.5px; font-weight: normal; color: #64748b; }
  .tpl-name .tn-sub::placeholder { color: #a7b6c4; }
  .tpl-row .tpl-name:not(.two) .tn-sub { display: none; }
  .tpl-row .tpl-name:focus-within {
    border-color: var(--blue); box-shadow: 0 0 0 3px rgba(11,119,181,.13);
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1>✏️ 异常名单沟通话术模板管理</h1>
    <p class="sub">修改后自动保存在本机浏览器(localStorage,key: raffle_templates_v3),审核主页自动读取。可用占位符:{姓名} {手机号} {奖池} {应属奖池} {奖品} {原因} {备注} {期数} {周期} {出单时间} {单数} {提交时间}</p>
  </div>
</header>

<main class="wrap">
  <section class="card-panel">
    <h2><span class="step">1</span> 编辑话术模板</h2>
    <div id="tplList" class="tpl-list"></div>
    <div class="tpl-actions">
      <button id="btnAddTpl" class="btn plain">＋ 新增模板</button>
      <button id="btnResetTpl" class="btn plain">↺ 恢复默认模板</button>
    </div>
  </section>

  <div class="tpl-actions">
    <a class="btn primary" href="index.html">← 返回审核主页</a>
  </div>

  <footer class="foot muted">纯静态页面 · 修改自动保存到本机浏览器</footer>
</main>

<script src="assets/templates-core.js"></script>
<script>
(function () {
  'use strict';
  var list = document.getElementById('tplList');
  var templates = (window.TplCore ? TplCore.load() : []);
  function persist() { if (window.TplCore) TplCore.save(templates); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
    });
  }
  function splitName(v) {
    var m = /^([^（(]+)[（(](.*?)[)）]\s*$/.exec(v || '');
    return m ? {main: m[1], sub: m[2]} : {main: v || '', sub: ''};
  }
  function joinName(main, sub) {
    main = (main || '').trim(); sub = (sub || '').trim();
    return main + (sub ? '（' + sub + '）' : '');
  }
  function render() {
    list.innerHTML = '';
    templates.forEach(function (t, i) {
      var row = document.createElement('div');
      row.className = 'tpl-row';
      var nm = splitName(t.type);
      var hasSub = !!nm.sub;
      row.innerHTML =
        '<label class="tpl-name' + (hasSub ? ' two' : '') + '">'
        + '<input class="tn-main" value="' + esc(nm.main) + '" placeholder="模板名称">'
        + '<input class="tn-sub" value="' + esc(nm.sub) + '" placeholder="补充说明(选填)">'
        + '</label>'
        + '<textarea rows="3"></textarea>'
        + '<button class="tpl-del" title="删除该模板">✕</button>';
      var mainInput = row.querySelector('.tn-main');
      var subInput = row.querySelector('.tn-sub');
      var ta = row.querySelector('textarea');
      ta.value = t.script || '';
      function syncName() {
        // 主名称里直接写「名称（说明）」也能自动拆开
        var p = splitName(mainInput.value);
        var subVal = subInput ? subInput.value : p.sub;
        t.type = joinName(p.main, subVal || p.sub);
        persist();
        if ((!!(subVal || p.sub)) !== hasSub) render();
      }
      mainInput.onchange = syncName;
      subInput.onchange = syncName;
      ta.oninput = function () { t.script = ta.value; persist(); };
      row.querySelector('.tpl-del').onclick = function () { templates.splice(i, 1); persist(); render(); };
      list.appendChild(row);
    });
  }
  document.getElementById('btnAddTpl').onclick = function () {
    templates.push({type: '新模板', script: ''});
    persist();
    render();
  };
  document.getElementById('btnResetTpl').onclick = function () {
    if (!confirm('确定恢复默认模板吗?当前所有修改将被覆盖。')) return;
    templates = JSON.parse(JSON.stringify(TplCore.DEFAULT_TEMPLATES));
    persist();
    render();
  };
  render();
})();
</script>
</body>
</html>
